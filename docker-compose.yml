services:
  mesh-health-check:
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      no_cache: true
    # Docker tags allow only [A-Za-z0-9_][A-Za-z0-9_.-]*, so the '+' in the
    # package version is illegal here. Use the hyphenated form, which
    # `npm run docker:tag` prints: 1.3.8+bayarea.1 -> 1.3.8-bayarea.1
    image: bayarea-mesh-health-check:${APP_IMAGE_TAG:-1.3.8-bayarea.1}
    container_name: mesh-health-check
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: "3090"
    volumes:
      - ./data:/app/data
    ports:
      - "3090:3090"
